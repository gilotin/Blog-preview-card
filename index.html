<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./public/assets/images/favicon-32x32.png"
        />
        <link rel="stylesheet" href="styles.css" />
        <title>Frontend Mentor | Blog preview card</title>
    </head>

    <body>
        <main>
            <article class="card">
                <img
                    class="card-image"
                    src="./public/assets/images/illustration-article.svg"
                    alt="Dev Tools sign"
                />

                <div class="card-content">
                    <p class="card-tag">Learning</p>

                    <p class="card-date">
                        <time datetime="2023-12-21"> </time> Published 21 Dec 2023
                    </p>

                    <h1 class="card-header">
                        <a href="#">HTML & CSS foundations</a>
                    </h1>

                    <p class="card-info">
                        These languages are the backbone of every website, defining structure,
                        content, and presentation.
                    </p>
                </div>
                <div class="author">
                    <img class="author-img" src="./public/assets/images/image-avatar.webp" alt="" />
                    <p class="author-name">Greg Hooper</p>
                </div>
            </article>
        </main>
    </body>
</html>
